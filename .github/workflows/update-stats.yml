name: Update dashboard stats

on:
  schedule:
    - cron: "17 11 * * *" # daily, 7:17am Grenada time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-stats.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet water-stats.json; then
            echo "No change"; exit 0
          fi
          git config user.name "wst-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Auto-update dashboard stats"
          git push
